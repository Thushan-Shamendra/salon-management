<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500" width="100%" height="100%">
  <defs>
    <linearGradient id="aboutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#EFE8DE" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D7B57C" />
      <stop offset="100%" stop-color="#B7925A" />
    </linearGradient>
  </defs>

  <rect width="600" height="500" rx="24" fill="url(#aboutBg)" />

  <!-- Geometric Decorative Borders -->
  <rect x="24" y="24" width="552" height="452" rx="20" fill="none" stroke="url(#gold)" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.6" />

  <!-- Center Arch Frame -->
  <path d="M 180 430 L 180 180 C 180 100 420 100 420 180 L 420 430 Z" fill="#FFFFFF" stroke="url(#gold)" stroke-width="2" />

  <!-- Organic Botanical Leaf Branch -->
  <path d="M 300 360 C 270 300 240 250 250 180" stroke="#7A8B73" stroke-width="3" stroke-linecap="round" fill="none" />
  <ellipse cx="255" cy="180" rx="14" ry="24" transform="rotate(-30 255 180)" fill="#8A9D83" opacity="0.8" />
  <ellipse cx="265" cy="225" rx="12" ry="20" transform="rotate(25 265 225)" fill="#7A8B73" opacity="0.8" />
  <ellipse cx="280" cy="275" rx="12" ry="18" transform="rotate(-20 280 275)" fill="#687B62" opacity="0.8" />

  <!-- Luxury Cosmetic Serum & Spa Essence Dropper -->
  <rect x="330" y="250" width="46" height="90" rx="8" fill="url(#gold)" opacity="0.9" />
  <rect x="345" y="225" width="16" height="25" fill="#3D352F" rx="3" />
  <line x1="353" y1="210" x2="353" y2="225" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" />
  <circle cx="353" cy="208" r="6" fill="#FFFFFF" />

  <!-- Sparkling Golden Embellishments -->
  <g fill="#B7925A">
    <path d="M 210 140 L 213 148 L 221 151 L 213 154 L 210 162 L 207 154 L 199 151 L 207 148 Z" />
    <path d="M 390 140 L 392 146 L 398 148 L 392 150 L 390 156 L 388 150 L 382 148 L 388 146 Z" />
    <circle cx="300" cy="130" r="4" fill="#C5A46D" />
  </g>

  <!-- Scissors / Artistry Motif -->
  <g transform="translate(300, 395) scale(0.9)" opacity="0.8">
    <circle cx="-10" cy="-10" r="8" fill="none" stroke="#292524" stroke-width="2" />
    <circle cx="10" cy="-10" r="8" fill="none" stroke="#292524" stroke-width="2" />
    <line x1="-5" y1="-5" x2="12" y2="20" stroke="#292524" stroke-width="2" />
    <line x1="5" y1="-5" x2="-12" y2="20" stroke="#292524" stroke-width="2" />
  </g>

  <!-- Tagline Banner -->
  <rect x="200" y="445" width="200" height="30" rx="15" fill="#FFFFFF" stroke="url(#gold)" stroke-width="1" />
  <text x="300" y="465" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#B7925A" text-anchor="middle" letter-spacing="2">EST. 2018 • ARTISANAL CARE</text>
</svg>
