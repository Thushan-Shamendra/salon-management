<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#211E1C" />
      <stop offset="50%" stop-color="#2D2825" />
      <stop offset="100%" stop-color="#1A1716" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E4C896" />
      <stop offset="50%" stop-color="#C5A46D" />
      <stop offset="100%" stop-color="#9A7742" />
    </linearGradient>
    <radialGradient id="glowGrad" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#C5A46D" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#1A1716" stop-opacity="0" />
    </radialGradient>
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Warm ambient glow -->
  <circle cx="400" cy="260" r="280" fill="url(#glowGrad)" filter="url(#softBlur)" />

  <!-- Salon Floor & Wall Arch Geometry -->
  <path d="M 0 480 L 800 480 L 800 600 L 0 600 Z" fill="#171413" />
  <line x1="0" y1="480" x2="800" y2="480" stroke="#C5A46D" stroke-opacity="0.2" stroke-width="2" />

  <!-- Arched Salon Mirror Backdrop (Center) -->
  <path d="M 280 480 L 280 200 C 280 130 520 130 520 200 L 520 480 Z" fill="#2E2824" stroke="url(#goldGrad)" stroke-width="3" />
  <path d="M 296 480 L 296 210 C 296 150 504 150 504 210 L 504 480 Z" fill="#25211E" stroke="#C5A46D" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Side Arches -->
  <path d="M 100 480 L 100 240 C 100 180 240 180 240 240 L 240 480 Z" fill="#241F1D" stroke="url(#goldGrad)" stroke-opacity="0.5" stroke-width="2" />
  <path d="M 560 480 L 560 240 C 560 180 700 180 700 240 L 700 480 Z" fill="#241F1D" stroke="url(#goldGrad)" stroke-opacity="0.5" stroke-width="2" />

  <!-- Warm Mirror Backlight -->
  <ellipse cx="400" cy="220" rx="90" ry="110" fill="#E4C896" fill-opacity="0.1" filter="url(#softBlur)" />

  <!-- Hanging Pendant Lights -->
  <line x1="200" y1="0" x2="200" y2="120" stroke="#C5A46D" stroke-width="1.5" />
  <circle cx="200" cy="130" r="12" fill="url(#goldGrad)" />
  <circle cx="200" cy="130" r="22" fill="#E4C896" fill-opacity="0.2" filter="url(#softBlur)" />

  <line x1="600" y1="0" x2="600" y2="120" stroke="#C5A46D" stroke-width="1.5" />
  <circle cx="600" cy="130" r="12" fill="url(#goldGrad)" />
  <circle cx="600" cy="130" r="22" fill="#E4C896" fill-opacity="0.2" filter="url(#softBlur)" />

  <!-- Modern Salon Chair (Centerpiece) -->
  <!-- Base & Stem -->
  <ellipse cx="400" cy="495" rx="60" ry="14" fill="#C5A46D" fill-opacity="0.7" />
  <rect x="394" y="415" width="12" height="75" rx="4" fill="url(#goldGrad)" />
  <rect x="380" y="440" width="40" height="6" rx="2" fill="#E4C896" />

  <!-- Seat Cushion -->
  <ellipse cx="400" cy="415" rx="65" ry="18" fill="#3D352F" stroke="#C5A46D" stroke-width="1.5" />

  <!-- Backrest -->
  <path d="M 345 400 C 345 320 455 320 455 400 Z" fill="#362E29" stroke="url(#goldGrad)" stroke-width="2" />

  <!-- Armrests -->
  <path d="M 335 410 C 330 365 350 360 360 380" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />
  <path d="M 465 410 C 470 365 450 360 440 380" fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Console Table & Styling Elements -->
  <rect x="310" y="380" width="180" height="8" rx="3" fill="url(#goldGrad)" opacity="0.9" />

  <!-- Subtle Scissors & Sparkles Emblem on Mirror -->
  <g transform="translate(400, 230) scale(0.9)" opacity="0.65">
    <circle cx="0" cy="0" r="32" fill="none" stroke="#C5A46D" stroke-width="1.5" stroke-dasharray="3 3" />
    <path d="M -12 -12 L 12 12 M -12 12 L 12 -12" stroke="#E4C896" stroke-width="2" stroke-linecap="round" />
    <circle cx="-14" cy="-14" r="5" fill="none" stroke="#E4C896" stroke-width="1.5" />
    <circle cx="-14" cy="14" r="5" fill="none" stroke="#E4C896" stroke-width="1.5" />
  </g>

  <!-- Botanical Plant Accent (Left) -->
  <path d="M 120 480 C 110 430 90 390 70 370" stroke="#7A8B73" stroke-width="3" stroke-linecap="round" fill="none" />
  <ellipse cx="70" cy="365" rx="14" ry="24" transform="rotate(-25 70 365)" fill="#687B62" opacity="0.9" />
  <ellipse cx="95" cy="405" rx="12" ry="20" transform="rotate(-15 95 405)" fill="#7A8B73" opacity="0.8" />
  <path d="M 130 480 C 135 420 150 380 170 350" stroke="#7A8B73" stroke-width="3" stroke-linecap="round" fill="none" />
  <ellipse cx="170" cy="345" rx="14" ry="24" transform="rotate(25 170 345)" fill="#687B62" opacity="0.9" />
  <!-- Plant Pot -->
  <polygon points="105,480 135,480 130,440 110,440" fill="#423933" stroke="#C5A46D" stroke-width="1" />

  <!-- Botanical Plant Accent (Right) -->
  <polygon points="675,480 705,480 700,430 680,430" fill="#423933" stroke="#C5A46D" stroke-width="1" />
  <path d="M 690 430 C 700 370 720 330 740 310" stroke="#7A8B73" stroke-width="3" fill="none" />
  <ellipse cx="740" cy="305" rx="15" ry="25" transform="rotate(30 740 305)" fill="#687B62" opacity="0.9" />
  <ellipse cx="715" cy="365" rx="13" ry="22" transform="rotate(15 715 365)" fill="#7A8B73" opacity="0.8" />

  <!-- Luxury Floating Sparkle Accents -->
  <g fill="#E4C896" opacity="0.85">
    <path d="M 330 150 L 333 158 L 341 161 L 333 164 L 330 172 L 327 164 L 319 161 L 327 158 Z" />
    <path d="M 470 140 L 472 146 L 478 148 L 472 150 L 470 156 L 468 150 L 462 148 L 468 146 Z" />
    <path d="M 230 220 L 232 226 L 238 228 L 232 230 L 230 236 L 228 230 L 222 228 L 228 226 Z" />
    <path d="M 570 210 L 572 216 L 578 218 L 572 220 L 570 226 L 568 220 L 562 218 L 568 216 Z" />
  </g>

  <!-- Bottom vignette gradient -->
  <rect y="500" width="800" height="100" fill="url(#bgGrad)" opacity="0.5" />
</svg>
