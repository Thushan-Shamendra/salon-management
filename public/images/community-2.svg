<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 400" width="100%" height="100%">
  <defs>
    <linearGradient id="commGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#382C31" />
      <stop offset="50%" stop-color="#2A2125" />
      <stop offset="100%" stop-color="#191316" />
    </linearGradient>
    <linearGradient id="roseGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0C5" />
      <stop offset="50%" stop-color="#DDA7A5" />
      <stop offset="100%" stop-color="#B77B82" />
    </linearGradient>
    <radialGradient id="bridalGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#FCEAE6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#191316" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="500" height="400" fill="url(#commGrad2)" />
  <circle cx="250" cy="180" r="160" fill="url(#bridalGlow)" />

  <!-- Elegant Floral Tiara / Bridal Veil Motif -->
  <path d="M 160 220 Q 250 120 340 220" fill="none" stroke="url(#roseGold)" stroke-width="4" stroke-linecap="round" />
  <path d="M 180 250 Q 250 160 320 250" fill="none" stroke="#FCEAE6" stroke-width="2" stroke-linecap="round" opacity="0.8" />
  
  <!-- Veil Swirls -->
  <path d="M 210 200 C 180 270 200 340 230 380" fill="none" stroke="#FCEAE6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />
  <path d="M 290 200 C 320 270 300 340 270 380" fill="none" stroke="#FCEAE6" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6" />

  <!-- Botanical Tiara Pearls & Leaves -->
  <circle cx="250" cy="160" r="7" fill="#FFFFFF" />
  <circle cx="220" cy="170" r="5" fill="url(#roseGold)" />
  <circle cx="280" cy="170" r="5" fill="url(#roseGold)" />
  <circle cx="190" cy="190" r="4" fill="#FFFFFF" />
  <circle cx="310" cy="190" r="4" fill="#FFFFFF" />

  <!-- Sparkles -->
  <path d="M 250 90 L 252 98 L 260 100 L 252 102 L 250 110 L 248 102 L 240 100 L 248 98 Z" fill="#FFFFFF" />
  <path d="M 360 150 L 362 155 L 367 157 L 362 159 L 360 164 L 358 159 L 353 157 L 358 155 Z" fill="#F5D0C5" />

  <!-- Overlay badge -->
  <rect x="24" y="24" width="130" height="28" rx="14" fill="#1C1917" fill-opacity="0.85" stroke="#DDA7A5" stroke-width="1" />
  <text x="89" y="42" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#F5D0C5" text-anchor="middle">BRIDAL GLAMOUR</text>
</svg>
