<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%">
  <defs>
    <linearGradient id="srvBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D2825" />
      <stop offset="100%" stop-color="#1C1917" />
    </linearGradient>
    <linearGradient id="srvGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C4B5FD" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
  </defs>

  <rect width="500" height="350" fill="url(#srvBg)" />

  <!-- Subtle salon backdrop motif -->
  <circle cx="250" cy="175" r="110" fill="none" stroke="url(#srvGold)" stroke-width="1.5" stroke-opacity="0.3" stroke-dasharray="6 6" />
  <circle cx="250" cy="175" r="75" fill="none" stroke="url(#srvGold)" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Center Salon Emblem -->
  <g transform="translate(250, 155) scale(1.4)">
    <!-- Scissors & Sparkle -->
    <circle cx="-10" cy="-10" r="7" fill="none" stroke="url(#srvGold)" stroke-width="1.8" />
    <circle cx="10" cy="-10" r="7" fill="none" stroke="url(#srvGold)" stroke-width="1.8" />
    <line x1="-5" y1="-5" x2="10" y2="15" stroke="url(#srvGold)" stroke-width="1.8" stroke-linecap="round" />
    <line x1="5" y1="-5" x2="-10" y2="15" stroke="url(#srvGold)" stroke-width="1.8" stroke-linecap="round" />
    <path d="M 0 -18 L 2 -12 L 8 -10 L 2 -8 L 0 -2 L -2 -8 L -8 -10 L -2 -12 Z" fill="#C4B5FD" />
  </g>

  <text x="250" y="240" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#C4B5FD" text-anchor="middle" letter-spacing="3">INVORA SALON</text>
  <text x="250" y="262" font-family="system-ui, sans-serif" font-size="11" fill="#A8A29E" text-anchor="middle" letter-spacing="1">PREMIUM BEAUTY SERVICE</text>
</svg>
